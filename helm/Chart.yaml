apiVersion: v2
name: slack-k8s-bot
description: Slack bot for K8s alerts with AI analysis via MCP
version: 1.0.0
appVersion: "1.0"

dependencies:
  - name: alertmanager
    version: "1.12.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: alertmanager.enabled
  - name: kube-prometheus-stack
    version: "65.0.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
