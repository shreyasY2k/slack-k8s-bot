{{- if .Values.alertmanager.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "slack-k8s-bot.fullname" . }}-alertmanager-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slack-k8s-bot.labels" . | nindent 4 }}
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'namespace', 'pod']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      receiver: 'slack-k8s-bot'
      routes:
      - match:
          severity: critical
        receiver: 'slack-k8s-bot'
        continue: true
      - match:
          severity: warning
        receiver: 'slack-k8s-bot'
        continue: true

    receivers:
    - name: 'slack-k8s-bot'
      webhook_configs:
      - url: 'http://{{ include "slack-k8s-bot.fullname" . }}:{{ .Values.service.port }}/alertmanager'
        send_resolved: false
        http_config:
          follow_redirects: true

    inhibit_rules:
    - source_match:
        severity: 'critical'
      target_match:
        severity: 'warning'
      equal: ['alertname', 'namespace', 'pod']
{{- end }}