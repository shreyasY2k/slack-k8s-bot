apiVersion: v1
kind: Secret
metadata:
  name: {{ include "slack-k8s-bot.fullname" . }}
  labels:
    {{- include "slack-k8s-bot.labels" . | nindent 4 }}
type: Opaque
stringData:
  slack-bot-token: {{ .Values.slack.botToken | quote }}
  slack-signing-secret: {{ .Values.slack.signingSecret | quote }}
  {{- if eq .Values.llm.provider "anthropic" }}
  anthropic-api-key: {{ .Values.llm.anthropicApiKey | quote }}
  {{- end }}
  {{- if eq .Values.llm.provider "openai" }}
  openai-api-key: {{ .Values.llm.openaiApiKey | quote }}
  {{- end }}
  {{- if eq .Values.llm.provider "gemini" }}
  gemini-api-key: {{ .Values.llm.geminiApiKey | quote }}
  {{- end }}